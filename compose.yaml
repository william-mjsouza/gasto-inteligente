# Ambiente local completo: PostgreSQL + aplicação (frontend servido pelo Spring Boot).
#
#   cp .env.example .env        # e defina POSTGRES_PASSWORD
#   docker compose up --build   # aplicação em http://localhost:8080
#
# Para desenvolvimento com hot reload, suba apenas o banco: docker compose up -d db
# Portas são publicadas somente em 127.0.0.1; o banco nunca fica exposto publicamente.
name: gasto-inteligente

services:
  db:
    # Mesma versão principal em desenvolvimento, testes (Testcontainers) e produção.
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gasto_inteligente}
      POSTGRES_USER: ${POSTGRES_USER:-gasto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A imagem oficial 18+ guarda os dados em /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gasto-inteligente:0.1.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-gasto_inteligente}
      POSTGRES_USER: ${POSTGRES_USER:-gasto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-30m}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

volumes:
  pgdata:
